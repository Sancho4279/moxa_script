# ==============================================================================
#  moxa_setup.conf - Konfiguration fuer moxa_setup.sh
#  Reines Shell-Fragment. Kommandozeilenoptionen gewinnen gegen diese Datei.
# ==============================================================================

# --- Zugangsdaten am Geraet ---------------------------------------------------
# Diese Datei enthaelt Passwoerter im Klartext.
#   chmod 600 moxa_setup.conf
# und nicht in eine Versionsverwaltung aufnehmen.
DEVICE_USER="admin"
DEVICE_PASS="moxa"

# Wird die eingestellte Kombination mit Fehlercode -2 oder -17 abgelehnt,
# probiert das Skript diese Passwoerter durch, jeweils mit und ohne
# Benutzernamen (aeltere Firmwarestaende kennen keinen).
# Reihenfolge zaehlt: die wahrscheinlichste Variante zuerst.
#
# Achtung: ab Firmware v2.0 kann eine Kontosperre nach mehreren
# Fehlversuchen greifen. Mit "--no-probe" laesst sich das Durchprobieren
# abschalten.
DEVICE_PASS_LIST=("moxa" "Be2ailoo" "admin")

# --- Erstkonfiguration ---------------------------------------------------------
# Neue NPort-Geraete werden unkonfiguriert geliefert. Das MCC-Tool verweigert
# dann Export und Import mit Fehlercode -17, bis ein Passwort existiert.
# Diese Zugangsdaten werden in dem Fall ohne Rueckfrage gesetzt.
INITIAL_USER="admin"
INITIAL_PASS="moxa"

# Pre-Shared Key fuer Config-Export/-Import.
# Ab NPort-6000-Firmware v1.14 verschluesselt das Geraet die exportierte
# Konfiguration mit diesem Schluessel. "-dk" entschluesselt sie zum Bearbeiten.
DEVICE_PSK="moxa"

# --- Umgebung -----------------------------------------------------------------
# Netzwerkinterface fuer die temporaere Adresse im Werksnetz.
# Leer lassen = automatisch das erste aktive Kabel-Interface.
STAGING_IFACE=""
STAGING_IP="192.168.127.10"

# Pfad zur mcc_tool-Binaerdatei. Leer = automatische Suche in
#   ./mcc_tool*/mcc_tool, /opt/moxa/mcc_tool/mcc_tool, /usr/local/bin/mcc_tool
MCC_BIN=""

SNMP_COMMUNITY="public"

# --- Schluesselmuster fuer den Konfigurations-Patch ---------------------------
# Die exportierte INI benennt die Felder je nach Baureihe und Firmwarestand
# unterschiedlich. Diese Regexe suchen den passenden Schluessel; die erste
# Klammergruppe muss den Schluesselnamen enthalten.
#
# Einmalig pruefen mit:   ./moxa_setup.sh --export-config
# Danach hier bei Bedarf nachschaerfen.
#
# KEY_RE_IP="^[[:space:]]*([A-Za-z_.]*ip[_.]?addr[A-Za-z_.]*)[[:space:]]*="
# KEY_RE_MASK="^[[:space:]]*([A-Za-z_.]*(netmask|subnet[_.]?mask)[A-Za-z_.]*)[[:space:]]*="
# KEY_RE_GW="^[[:space:]]*([A-Za-z_.]*gateway[A-Za-z_.]*)[[:space:]]*="
# KEY_RE_NAME="^[[:space:]]*([A-Za-z_.]*(server[_.]?name|device[_.]?name)[A-Za-z_.]*)[[:space:]]*="
